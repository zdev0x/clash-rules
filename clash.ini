[custom]

; ===== Rulesets (order matters) =====
; App-priority custom lists hosted in this repo
ruleset=🐙 GitHub,https://cdn.jsdelivr.net/gh/zdev0x/clash-rules@release/rulesets/github.list
ruleset=✨ Cursor,https://cdn.jsdelivr.net/gh/zdev0x/clash-rules@release/rulesets/cursor.list
ruleset=🐳 Docker,https://cdn.jsdelivr.net/gh/zdev0x/clash-rules@release/rulesets/docker.list
ruleset=🤖 AI 服务,https://cdn.jsdelivr.net/gh/zdev0x/clash-rules@release/rulesets/openai.list
ruleset=🤖 AI 服务,https://cdn.jsdelivr.net/gh/zdev0x/clash-rules@release/rulesets/gemini.list
ruleset=🤖 AI 服务,https://cdn.jsdelivr.net/gh/zdev0x/clash-rules@release/rulesets/claude.list
ruleset=🤖 AI 服务,https://cdn.jsdelivr.net/gh/zdev0x/clash-rules@release/rulesets/copilot.list
ruleset=📺 国外媒体,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/Netflix.list
ruleset=📺 国外媒体,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/YouTube.list
ruleset=📺 国外媒体,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/DisneyPlus.list
ruleset=📺 国外媒体,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/Spotify.list
ruleset=💰 Binance,https://cdn.jsdelivr.net/gh/zdev0x/clash-rules@release/rulesets/binance.list

; Major ecosystems (Loyalsoldier)
ruleset=🔎 Google,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/google.txt
ruleset=🍎 Apple,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/apple.txt
ruleset=🌐 全球直连,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt

; Base allow/deny (Loyalsoldier)
; Custom user reject list (applies first)
ruleset=REJECT,https://cdn.jsdelivr.net/gh/zdev0x/clash-rules@release/rulesets/custom/reject.list
; ACL4SSR adblock lists (精简版，避免性能问题)
; 已移除 BanEasyList 和 BanEasyPrivacy（条目过多，影响性能）
ruleset=REJECT,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/BanAD.list
ruleset=REJECT,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/BanEasyListChina.list
ruleset=REJECT,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/BanProgramAD.list
ruleset=REJECT,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt
ruleset=DIRECT,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt
ruleset=DIRECT,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt
ruleset=DIRECT,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt

; CIDR (Loyalsoldier)
ruleset=Telegram,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt
ruleset=DIRECT,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt
ruleset=DIRECT,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt

; Optional global-proxy modes (uncomment at will)
; ruleset=🚀 节点选择,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt
; ruleset=🚀 节点选择,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/tld-not-cn.txt

; Final fallbacks
; Explicit LAN/loopback/multicast link-local to ensure local IPs never fall through
ruleset=DIRECT,[]IP-CIDR,127.0.0.0/8
ruleset=DIRECT,[]IP-CIDR,10.0.0.0/8
ruleset=DIRECT,[]IP-CIDR,172.16.0.0/12
ruleset=DIRECT,[]IP-CIDR,192.168.0.0/16
ruleset=DIRECT,[]IP-CIDR,224.0.0.0/4
ruleset=DIRECT,[]IP-CIDR,fe80::/10
ruleset=🌐 全球直连,[]GEOIP,CN
; Prefer direct for .cn domains and '-cn' keywords
ruleset=🌐 全球直连,[]DOMAIN-SUFFIX,cn
ruleset=🌐 全球直连,[]DOMAIN-KEYWORD,-cn
ruleset=🐟 漏网之鱼,[]FINAL


; ===== Proxy Groups =====
; Upstream generic groups
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,100
custom_proxy_group=🔧 手动选择`select`.*

; App-priority groups (bind to upstream)
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🔧 手动选择`[]DIRECT
custom_proxy_group=🐙 GitHub`select`[]🚀 节点选择`[]DIRECT`.*
custom_proxy_group=✨ Cursor`select`[]🚀 节点选择`[]DIRECT`.*
custom_proxy_group=🐳 Docker`select`[]🚀 节点选择`[]DIRECT`.*
custom_proxy_group=🤖 AI 服务`select`[]🚀 节点选择`[]DIRECT`.*
custom_proxy_group=📺 国外媒体`select`[]🚀 节点选择`[]DIRECT`.*
custom_proxy_group=🔎 Google`select`[]🚀 节点选择`[]DIRECT`.*
custom_proxy_group=🍎 Apple`select`[]🚀 节点选择`[]DIRECT`.*
custom_proxy_group=✈️ Telegram`select`[]🚀 节点选择`[]DIRECT`.*
custom_proxy_group=💰 Binance`select`[]🚀 节点选择`[]DIRECT`.*
custom_proxy_group=🌐 全球直连`select`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]DIRECT`.*

; ===== Options =====
skip_failed_ruleset=true
overwrite_original_rules=true
add_emoji=true

