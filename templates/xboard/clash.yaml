# port: 7890
# socks-port: 7891
# redir-port: 7892
# tproxy-port: 7893
mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

dns:
  enable: true
  # listen: 0.0.0.0:53
  ipv6: false

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - https://doh-pure.onedns.net/dns-query
    - https://ada.openbld.net/dns-query
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
  fallback-filter:
    geoip: true
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
proxies:

proxy-groups:

  - name: "♻️ 自动选择"
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies: []

  - name: "🔧 手动选择"
    type: select
    proxies: ["DIRECT"]

  - name: "🚀 节点选择"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🔧 手动选择"
      - "DIRECT"

  # Service groups (app-priority), allow direct node selection via ".*"
  - { name: "🐙 GitHub", type: select, proxies: ["🚀 节点选择", "DIRECT"] }
  - { name: "✨ Cursor", type: select, proxies: ["🚀 节点选择"] }
  - { name: "🐳 Docker", type: select, proxies: ["🚀 节点选择"] }
  - { name: "🤖 AI 服务", type: select, proxies: ["🚀 节点选择"] }
  - { name: "📺 国外媒体", type: select, proxies: ["🚀 节点选择"] }
  - { name: "🔎 Google", type: select, proxies: ["🚀 节点选择"] }
  - { name: "🍎 Apple", type: select, proxies: ["🚀 节点选择", "DIRECT"] }
  - { name: "💻 Microsoft", type: select, proxies: ["🚀 节点选择", "DIRECT"] }
  - { name: "✈️ Telegram", type: select, proxies: ["🚀 节点选择"] }
  - { name: "💰 Binance", type: select, proxies: ["🚀 节点选择", "DIRECT"] }

  - name: "🌐 全球直连"
    type: select
    proxies: ["DIRECT"]

  - name: "🐟 漏网之鱼"
    type: select
    proxies: ["🚀 节点选择", "DIRECT"]

rules:
  # 国内AI
  - DOMAIN-SUFFIX,qwen.ai,DIRECT
  # Explicit LAN/loopback/multicast link-local
  - IP-CIDR,127.0.0.0/8,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT
  - IP-CIDR,172.16.0.0/12,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  - IP-CIDR,224.0.0.0/4,DIRECT
  - IP-CIDR6,fe80::/10,DIRECT

  # Prefer direct for .cn domains and '-cn' keywords
  - DOMAIN-SUFFIX,cn,DIRECT
  - DOMAIN-KEYWORD,-cn,DIRECT

  # Base direct
  - GEOIP,LAN,DIRECT

  # Adblock (slim)
  - RULE-SET,reject-custom,REJECT
  - RULE-SET,reject,REJECT
  - RULE-SET,reject-cn,REJECT
  - RULE-SET,reject-app,REJECT

  # App-priority
  - RULE-SET,github,🐙 GitHub
  - RULE-SET,cursor,✨ Cursor
  - RULE-SET,docker,🐳 Docker
  - RULE-SET,openai,🤖 AI 服务
  - RULE-SET,gemini,🤖 AI 服务
  - RULE-SET,claude,🤖 AI 服务
  # - RULE-SET,copilot,🤖 AI 服务

  # Media
  - RULE-SET,overseas-media-netflix,📺 国外媒体
  - RULE-SET,overseas-media-youtube,📺 国外媒体
  - RULE-SET,overseas-media-disney,📺 国外媒体
  - RULE-SET,overseas-media-spotify,📺 国外媒体

  # Ecosystems
  - RULE-SET,google,🔎 Google
  - RULE-SET,apple,🍎 Apple
  - RULE-SET,microsoft,💻 Microsoft
  - RULE-SET,telegram,✈️ Telegram
  - RULE-SET,binance,💰 Binance

  # China routes
  - GEOIP,CN,🌐 全球直连

  # Final fallback
  - MATCH,🐟 漏网之鱼

rule-providers:
  github: { type: http, behavior: classical, url: "https://cdn.jsdelivr.net/gh/zdev0x/clash-rules@release/providers/github.yaml", path: ./ruleset/github.yaml, interval: 86400 }
