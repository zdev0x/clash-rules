    path: ./ruleset/overseas_media_spotify.yaml
    interval: 86400

  binance:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/zdev0x/clash-rules@release/providers/binance.yaml"
    path: ./ruleset/binance.yaml
    interval: 86400

  microsoft:
    type: http
