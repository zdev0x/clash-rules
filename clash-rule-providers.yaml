# Clash 配置示例（rule-providers 模式）
# 此文件展示如何通过 rule-providers 使用你的规则组
# 需要替换 <你的代理组名称> 为实际的代理组名称

rule-providers:
  # 自定义规则组（从本仓库加载）
  github:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/zdev0x/clash-rules@release/providers/github.yaml"
    path: ./ruleset/github.yaml
    interval: 86400

  cursor:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/zdev0x/clash-rules@release/providers/cursor.yaml"
