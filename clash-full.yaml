# Clash full config (ready to import)
# - Includes rule-providers (pulls from your repo + upstreams)
# - Defines proxy-groups per your service groups
# - You must add your actual nodes under `proxies:` or via external providers

# ===== Basic =====
port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090

# ===== Proxies (fill or use proxy-providers) =====
proxies: [
  
]

# ===== Proxy Groups =====
proxy-groups:
  - name: "♻️ 自动选择"
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    proxies: ["DIRECT"]

  - name: "🔧 手动选择"
    type: select
    proxies: ["DIRECT"]

  - name: "🚀 节点选择"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🔧 手动选择"
      - "DIRECT"

  # Service groups
  - name: "🐙 GitHub"
    type: select
    proxies: ["🚀 节点选择", "DIRECT", ".*"]

  - name: "✨ Cursor"
    type: select
    proxies: ["🚀 节点选择", "DIRECT", ".*"]

  - name: "🐳 Docker"
    type: select
    proxies: ["🚀 节点选择", "DIRECT", ".*"]

  - name: "🤖 OpenAI"
    type: select
    proxies: ["🚀 节点选择", "DIRECT", ".*"]

  - name: "🧠 Gemini"
    type: select
    proxies: ["🚀 节点选择", "DIRECT", ".*"]

  - name: "💬 Claude"
    type: select
    proxies: ["🚀 节点选择", "DIRECT", ".*"]

  - name: "🤖 Copilot"
    type: select
    proxies: ["🚀 节点选择", "DIRECT", ".*"]

  - name: "📺 国外媒体"
    type: select
    proxies: ["🚀 节点选择", "DIRECT", ".*"]

  - name: "🔎 Google"
    type: select
    proxies: ["🚀 节点选择", "DIRECT", ".*"]

  - name: "🍎 Apple"
    type: select
    proxies: ["🚀 节点选择", "DIRECT", ".*"]

  - name: "✈️ Telegram"
    type: select
    proxies: ["🚀 节点选择", "DIRECT", ".*"]

  - name: "💰 Binance"
    type: select
    proxies: ["🚀 节点选择", "DIRECT", ".*"]

  - name: "🌐 全球直连"
    type: select
    proxies: ["DIRECT"]

  - name: "🎯 漏网之鱼"
    type: select
    proxies: ["🚀 节点选择", "DIRECT"]

# ===== Rule Providers =====
rule-providers:
  github:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/zdev0x/clash-rules@release/providers/github.yaml"
    path: ./ruleset/github.yaml
    interval: 86400

  cursor:
    type: http
