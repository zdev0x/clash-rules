# ===== Rules =====
rules:
  # Explicit LAN/loopback/multicast link-local
  - IP-CIDR,127.0.0.0/8,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT
  - IP-CIDR,172.16.0.0/12,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  - IP-CIDR,224.0.0.0/4,DIRECT
  - IP-CIDR,fe80::/10,DIRECT
  # Base direct
  - RULE-SET,direct,DIRECT
  - GEOIP,LAN,DIRECT
  # Prefer direct for .cn domains and '-cn' keywords
  - DOMAIN-SUFFIX,cn,🌐 全球直连
  - DOMAIN-KEYWORD,-cn,🌐 全球直连
  - GEOIP,CN,🌐 全球直连

  # Adblock (order matters)
  - RULE-SET,reject-custom,REJECT
  - RULE-SET,reject,REJECT
  - RULE-SET,reject-cn,REJECT
  - RULE-SET,reject-app,REJECT

  # App-priority
  - RULE-SET,github,🐙 GitHub
  - RULE-SET,cursor,✨ Cursor
  - RULE-SET,docker,🐳 Docker
  - RULE-SET,openai,🤖 AI 服务
  - RULE-SET,gemini,🤖 AI 服务
  - RULE-SET,claude,🤖 AI 服务
  - RULE-SET,copilot,🤖 AI 服务

  # Media
  - RULE-SET,overseas-media-netflix,📺 国外媒体
  - RULE-SET,overseas-media-youtube,📺 国外媒体
  - RULE-SET,overseas-media-disney,📺 国外媒体
  - RULE-SET,overseas-media-spotify,📺 国外媒体

  # Ecosystems
  - RULE-SET,google,🔎 Google
  - RULE-SET,apple,🍎 Apple
  - RULE-SET,telegram,✈️ Telegram
  - RULE-SET,binance,💰 Binance

  # Final fallback
  - MATCH,🐟 漏网之鱼
